name: Build BigFish

# 触发方式：
#   1. 在 GitHub 页面手动点 "Run workflow"（只构建，不发版）
#   2. 推送 v 开头的 tag（如 v0.1.0）：四个平台构建 + 自动创建 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Mac
          - os: macos-latest
            label: macOS (arm64)
            args: '--target aarch64-apple-darwin'
            artifact: BigFish-macos-arm64
          # Intel Mac（在 arm runner 上交叉编译）
          - os: macos-latest
            label: macOS (x64)
            args: '--target x86_64-apple-darwin'
            artifact: BigFish-macos-x64
          - os: ubuntu-22.04
            label: Linux (x64)
            args: ''
            artifact: BigFish-linux-x64
          - os: windows-latest
            label: Windows (x64)
            args: ''
            artifact: BigFish-windows-x64

    steps:
      - uses: actions/checkout@v4

      # Linux 需要 WebKitGTK 等系统库
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: matrix.args != ''
        run: rustup target add ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      # 缓存 Rust 产物：第一次为空，之后能省掉大部分重编译
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      # 关键优化：用 npm 上的预编译 CLI（几秒装好）。
      # 原来用 `cargo install tauri-cli` 要从源码编译 200+ 依赖，每个 job 白等 10–15 分钟。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Build
        working-directory: src-tauri
        run: tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app/**
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe

  # 单独一个 job 统一发版：四个平台同时创建 Release 会打架
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 检查产物清单
        run: find artifacts -type f | head -60

      - name: Checkout BigFish（读取 CHANGELOG）
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md

      - name: 提取对应版本更新日志
        run: |
          python3 - <<'PYEOF2'
          import os, re
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = re.compile(r'^##\s+v?' + re.escape(tag) + r'\b.*?(?=^##\s|\Z)', re.S | re.M)
          m = pattern.search(text)
          body = m.group(0).strip() if m else '版本 ' + tag + ' 的更新日志待补充。'
          body += '\n\n---\n完整更新日志：[CHANGELOG.md](https://github.com/bigfinlab/bigfish/blob/main/CHANGELOG.md)'
          open('release-body.md', 'w', encoding='utf-8').write(body)
          print(body[:400])
          PYEOF2

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: BigFish ${{ github.ref_name }} · 大肥鱼启动器
          body_path: release-body.md
          generate_release_notes: false
          # 目录形式的 .app 不上传，发给用户的是 dmg / msi / deb / AppImage
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.AppImage
