name: Build BigFish

# 触发方式：
#   1. 在 GitHub 页面手动点 "Run workflow"
#   2. 推送 v 开头的 tag（如 v0.1.0）自动构建并上传
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Mac
          - os: macos-latest
            label: macOS (arm64)
            args: '--target aarch64-apple-darwin'
            artifact: BigFish-macos-arm64
          # Intel Mac（在 arm runner 上交叉编译）
          - os: macos-latest
            label: macOS (x64)
            args: '--target x86_64-apple-darwin'
            artifact: BigFish-macos-x64
          - os: ubuntu-22.04
            label: Linux (x64)
            args: ''
            artifact: BigFish-linux-x64
          - os: windows-latest
            label: Windows (x64)
            args: ''
            artifact: BigFish-windows-x64

    steps:
      - uses: actions/checkout@v4

      # Linux 需要 WebKitGTK 等系统库
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: matrix.args != ''
        run: rustup target add ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app/**
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
