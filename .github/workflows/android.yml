name: Build BigFish Android APK

# 云端构建安卓完整启动器（基于 Amethyst = PojavLauncher 后继，LGPL-3.0）
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '.github/android/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Android Debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout BigFish
        uses: actions/checkout@v4

      - name: Clone Amethyst (PojavLauncher successor)
        run: |
          git clone --depth 1 --recursive --branch v3_openjdk \
            https://github.com/AngelAuraMC/Amethyst-Android.git amethyst
          echo "源码大小: $(du -sh amethyst | cut -f1)"

      - name: Apply BigFish branding
        run: bash .github/android/brand.sh amethyst

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Build debug APK
        working-directory: amethyst
        run: |
          ./scripts/languagelist_updater.sh
          gradle :app_pojavlauncher:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             "$GITHUB_WORKSPACE/out/BigFish-android-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BigFish-android-debug
          path: out/BigFish-android-debug.apk
          retention-days: 30


      - name: Smoke test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "=== adb devices ==="
            adb devices
            echo "=== install APK ==="
            adb install -r "$GITHUB_WORKSPACE/out/BigFish-android-debug.apk" && echo "INSTALL_OK" || echo "INSTALL_FAILED"
            echo "=== packages ==="
            adb shell pm list packages | grep -i amethyst || echo "PACKAGE_NOT_FOUND"
            echo "=== launch ==="
            adb shell monkey -p org.angelauramc.amethyst -c android.intent.category.LAUNCHER 1 && echo "LAUNCH_OK" || echo "LAUNCH_FAILED"
            sleep 30
            echo "=== focus ==="
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || echo "NO_FOCUS_INFO"
            mkdir -p "$GITHUB_WORKSPACE/out"
            echo "=== screencap ==="
            if adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/emulator-screen.png"; then
              echo "SCREENSHOT_OK"
            else
              echo "SCREENSHOT_FAILED"
            fi
            file "$GITHUB_WORKSPACE/out/emulator-screen.png" 2>/dev/null || true
            adb logcat -d > "$GITHUB_WORKSPACE/out/emulator-logcat.txt" || true
            ls -lh "$GITHUB_WORKSPACE/out/" || true

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-test
          path: |
            out/emulator-screen.png
            out/emulator-logcat.txt
          if-no-files-found: warn


      - name: Publish screenshot to GitHub Pages
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/out/emulator-screen.png" ]; then
            cp "$GITHUB_WORKSPACE/out/emulator-screen.png" "$GITHUB_WORKSPACE/docs/emulator-screen.png"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/emulator-screen.png
            git commit -m "ci: 更新安卓模拟器冒烟测试截图" || echo "nothing to commit"
            git push || echo "push failed"
          else
            echo "截图文件不存在，跳过"
          fi

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta-${{ github.run_number }}
          name: "BigFish Android Beta #${{ github.run_number }}"
          body: |
            云端构建的安卓完整启动器（基于 Amethyst / PojavLauncher 后继，LGPL-3.0）。
            
            **功能**：Minecraft Java 版启动器 —— 版本下载、Forge/Fabric/Quilt 安装、微软/离线登录、触屏操作、内置 JRE。
            **安装**：下载 APK 后允许"未知来源"安装；这是 debug 版（测试用）。
            
            源码：https://github.com/bigfinlab/bigfish
            上游：https://github.com/AngelAuraMC/Amethyst-Android
          files: |
            out/BigFish-android-debug.apk
            out/emulator-screen.png
            out/emulator-logcat.txt
          prerelease: true
