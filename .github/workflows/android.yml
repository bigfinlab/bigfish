name: Build BigFish Android APK

# 云端构建安卓完整启动器（基于 Amethyst = PojavLauncher 后继，LGPL-3.0）
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '.github/android/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Android Debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout BigFish
        uses: actions/checkout@v4

      - name: Clone Amethyst (PojavLauncher successor)
        run: |
          git clone --depth 1 --recursive --branch v3_openjdk \
            https://github.com/AngelAuraMC/Amethyst-Android.git amethyst
          echo "源码大小: $(du -sh amethyst | cut -f1)"

      - name: Apply BigFish branding
        run: bash .github/android/brand.sh amethyst

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Build debug APK
        working-directory: amethyst
        run: |
          ./scripts/languagelist_updater.sh
          gradle :app_pojavlauncher:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
             "$GITHUB_WORKSPACE/out/BigFish-android-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BigFish-android-debug
          path: out/BigFish-android-debug.apk
          retention-days: 30


      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.0
          name: "大肥鱼安卓版 v0.1.0 · Android Beta"
          body: |
            **大肥鱼安卓版 v0.1.0**（Android Beta）—— 开源免费的 Minecraft Java 版启动器。

            **功能**：版本下载、Forge / Fabric / Quilt 安装、微软 / 离线登录、触屏操作、内置 JRE。
            **安装**：下载 APK 后允许「未知来源」安装。
            **说明**：基于 Amethyst-Android（PojavLauncher 后继，LGPL-3.0）构建，保留上游版权声明。

            源码：https://github.com/bigfinlab/bigfish
            官网：https://bigfinlab.github.io/bigfish/
            上游：https://github.com/AngelAuraMC/Amethyst-Android
          files: out/BigFish-android-debug.apk
          prerelease: true
